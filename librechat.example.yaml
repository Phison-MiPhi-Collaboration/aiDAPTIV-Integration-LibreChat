version: 1.3.17
cache: true

endpoints:
  custom:
    - name: "llama.cpp"
      apiKey: "no-key"
      baseURL: "http://host.docker.internal:8080/v1"

      models:
        default:
          - "gemma-4"
        fetch: false

      titleConvo: true
      titleModel: "gemma-4"
      titleMethod: "completion"
      titleTiming: "immediate"
      modelDisplayLabel: "llama.cpp"

      addParams:
        cache_prompt: true
        offload_folder_name: "benchmark-10"

# librechat.yaml
fileConfig:
  defaultLLMDeliveryPath:
    overrides:
      "application/pdf": "text" 